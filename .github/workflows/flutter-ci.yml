name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format and commit Dart sources when required
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format Phase 02 repair sources"
            git push
            echo "Formatting changes were committed; validation will rerun on the formatted SHA."
            exit 1
          fi
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Run Flutter analyzer
        run: flutter analyze --fatal-infos
      - name: Run unit and widget tests
        run: flutter test
