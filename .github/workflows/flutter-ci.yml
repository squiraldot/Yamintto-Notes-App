name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Temporary formatter output for Phase 02 fixes
        run: dart format --output=show lib/features/folders/presentation/folder_browser_screen.dart test/features/phase_02_screens_test.dart
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Run Flutter analyzer
        run: flutter analyze --fatal-infos
      - name: Run unit and widget tests
        run: flutter test
