name: Flutter CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Export normalized bootstrap files (temporary)
        shell: bash
        run: |
          echo APP_THEME_BASE64_BEGIN
          dart format --output=show lib/core/theme/app_theme.dart | base64 --wrap=0
          echo
          echo APP_THEME_BASE64_END
          echo ANALYSIS_OPTIONS_BASE64_BEGIN
          base64 --wrap=0 analysis_options.yaml
          echo
          echo ANALYSIS_OPTIONS_BASE64_END
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Export standard Gradle wrapper JAR (temporary)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/yamintto-wrapper
          cd /tmp/yamintto-wrapper
          gradle wrapper --gradle-version 8.11.1
          echo GRADLE_WRAPPER_JAR_BASE64_BEGIN
          base64 --wrap=0 gradle/wrapper/gradle-wrapper.jar
          echo
          echo GRADLE_WRAPPER_JAR_BASE64_END
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Run Flutter analyzer
        run: flutter analyze --fatal-infos
      - name: Run unit and widget tests
        run: flutter test
      - name: Run integration tests when present
        shell: bash
        run: |
          if find integration_test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test integration_test
          else
            echo "No integration tests are defined yet; skipping device-level integration tests."
          fi
