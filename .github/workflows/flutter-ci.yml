name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source commit under test
        uses: actions/checkout@v5
        with:
          # pull_request defaults to a synthetic merge commit. Test the PR
          # head itself so workflow_run.head_sha is the exact tested source.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Diagnose formatter output for disposal regression (temporary)
        if: failure()
        run: dart format --output=show test/features/notes/note_autosave_coordinator_test.dart
      - name: Run Flutter analyzer
        run: flutter analyze --fatal-infos
      - name: Run unit and widget tests
        run: flutter test
