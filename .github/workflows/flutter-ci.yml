name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source commit under test
        uses: actions/checkout@v5
        with:
          # pull_request defaults to a synthetic merge commit. Test the PR
          # head itself so downstream artifact builds use the exact tested SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Run Flutter analyzer
        run: flutter analyze --fatal-infos
      - name: Report pull request source branch for artifact gate
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "head_ref=${{ github.head_ref }}"
          echo "event_head_ref=${{ github.event.pull_request.head.ref }}"
      - name: Run unit and widget tests
        run: flutter test

  build-phase-03-universal-debug-apk:
    name: Phase 03 universal Debug APK
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase-03/markdown-autosave' }}
    needs: validate
    uses: ./.github/workflows/yamintto-debug-apk.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}

  build-phase-03-arm64-debug-apk:
    name: Phase 03 ARM64 Debug APK
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase-03/markdown-autosave' }}
    needs: validate
    uses: ./.github/workflows/yamintto-arm64-debug-apk.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
