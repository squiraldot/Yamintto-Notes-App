name: ARM64-only Debug APK

on:
  workflow_run:
    workflows:
      - Flutter CI
    types:
      - completed
    branches:
      - main
      - dev
      - phase-03/markdown-autosave
  workflow_call:
    inputs:
      source_sha:
        description: Exact source SHA validated by the calling Flutter CI job.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yamintto-arm64-debug-apk-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-arm64-debug-apk:
    name: Build ARM64-only Android debug APK
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_call' && inputs.source_sha != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact CI-tested source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.source_sha || github.event.workflow_run.head_sha }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build ARM64-only debug APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload ARM64-only debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yamintto-arm64-debug-${{ github.event_name == 'workflow_call' && inputs.source_sha || github.event.workflow_run.head_sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
