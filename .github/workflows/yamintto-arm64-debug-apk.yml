name: ARM64-only Debug APK

on:
  workflow_run:
    workflows:
      - Flutter CI
    types:
      - completed
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: yamintto-arm64-debug-apk-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-arm64-debug-apk:
    name: Build ARM64-only Android debug APK
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact CI-tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build ARM64-only debug APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload ARM64-only debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yamintto-arm64-debug-${{ github.event.workflow_run.head_sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
