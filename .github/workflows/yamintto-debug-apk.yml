name: Yamintto Debug APK

on:
  workflow_run:
    workflows:
      - Flutter CI
    types:
      - completed
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: yamintto-debug-apk-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact CI-tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build debug APK only
        run: flutter build apk --debug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yamintto-debug-${{ github.event.workflow_run.head_sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
